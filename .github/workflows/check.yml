name: 24h SeoulTech Notice Checker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run checker
        env:
          NAVER_USER: ${{ secrets.NAVER_USER }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python web_notifier.py

      - name: Save cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_notices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update cache" && git push)
